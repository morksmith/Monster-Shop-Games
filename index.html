<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/x-icon" href="content/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko&display=swap" rel="stylesheet">
  <title>Monster Shop Games</title>
  
  <style>
    body {
      background-color: #151122;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Modern Responsive Grid */
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      max-width: 1200px;
      width: 100%;
      margin: 20px 0;
    }

    .column {
      flex: 1;
      min-width: 300px; /* Forces stack on mobile */
      text-align: center;
    }

    .banner {
      max-width: 100%;
      height: auto;
      margin-bottom: 30px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .social-links img {
      width: 50px;
      transition: transform 0.2s;
    }

    .social-links img:hover {
      transform: scale(1.1);
    }

    a { text-decoration: none; color: inherit; }
    
    footer { margin-top: 50px; }
  </style>
</head>

<body>

  <img src="content/Monster Shop Banner Large.png" alt="Monster Shop Logo" class="banner">

  <div class="container">
    <div class="column">
      <img src="content/Pie in the Sky - Logo V9.png" alt="Pie in the Sky Logo" style="width:100%; max-width:512px;">
      <br>
      <a href="https://store.steampowered.com/app/2941360/Pie_in_the_Sky/" target="_blank">
        <img alt="Wishlist Pie in the Sky" src="content/Wishlist Steam Button.png" style="width:256px;">
      </a>
    </div>

    <div class="column">
      <a href="https://dungeon-merchant.xsollasitebuilder.com/" target="_blank">
        <img src="DM Icon Large.png" alt="Dungeon Merchant Icon" style="width:100%; max-width:300px;">
      </a>
      <h3>Dungeon Merchant</h3>
      <a href="https://store.steampowered.com/app/2261940/Dungeon_Merchant/" target="_blank">
        <img alt="Dungeon Merchant Steam" src="content/Steam Button.png" style="width:256px;">
      </a>
    </div>
  </div>

  <a href="https://discord.gg/6RtrSbD38v" target="_blank">
    <img alt="discord" src="content/Discord Button.png" style="width:320px; max-width:90%;">
  </a>

  <div class="social-links">
    <a href="https://twitter.com/MonsterShopAU" target="_blank"><img alt="twitter" src="content/Twitter.png"></a>
    <a href="https://facebook.com/..." target="_blank"><img alt="facebook" src="content/Facebook.png"></a>
    <a href="https://instagram.com/..." target="_blank"><img alt="instagram" src="content/Instagram.png"></a>
    <a href="https://tiktok.com/..." target="_blank"><img alt="tiktok" src="content/TikTok.png"></a>
    <a href="https://ko-fi.com/..." target="_blank"><img alt="ko-fi" src="content/ko-fi.256x256.png"></a>
    <a href="https://youtube.com/..." target="_blank"><img alt="youtube" src="content/YouTube.png"></a>
  </div>

  <footer>
    <a href="mailto:contact@monstershopgames.com">contact@monstershopgames.com</a>
  </footer>

</body>
